# Install as /etc/nginx/conf.d/auth.lidoll.dev.conf on the reverse-proxy server.
# Requires the certificate below first; see AUTH_PROXY_SETUP.md for bootstrap steps.
# This is a complete http-context configuration, not an include inside another server.
server {
    listen 80;
    listen [::]:80;
    server_name auth.lidoll.dev;

    # Serve certificate challenges locally, including future webroot renewals.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://auth.lidoll.dev$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name auth.lidoll.dev;

    # Replace these paths if an existing certificate already covers auth.lidoll.dev.
    ssl_certificate /etc/letsencrypt/live/auth.lidoll.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.lidoll.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        # Preserve OIDC paths and query strings when forwarding to the identity service.
        proxy_pass http://10.1.1.23:4180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache off;
        client_max_body_size 16k;
    }
}
