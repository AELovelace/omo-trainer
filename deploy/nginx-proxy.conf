# Profile pictures have a separate bounded upload allowance.
location = /tracker/api/social/profile {
    proxy_pass http://10.1.1.23:4173;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_cache off;
    client_max_body_size 3m;
}

# Picture status posts have a separate bounded upload allowance.
location = /tracker/api/social/posts {
    proxy_pass http://10.1.1.23:4173;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_cache off;
    client_max_body_size 12m;
}

# Include inside the existing lidoll.dev HTTPS server block.
# Uses your configured service server at 10.1.1.23; adjust if that address changes.
# Node must listen on that interface with BASE_PATH=/tracker/ and PORT=4173.
location = /tracker {
    return 308 /tracker/;
}

location ^~ /tracker/ {
    proxy_pass http://10.1.1.23:4173;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_cache off;
    client_max_body_size 256k;
}
