# Temporary HTTP-only configuration used to obtain the first certificate.
# Install at the SAME destination as nginx-auth-server.conf, replacing it after issuance.
server {
    listen 80;
    listen [::]:80;
    server_name auth.sadgirlsclub.wtf;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    # Do not serve sign-in pages over HTTP while waiting for the certificate.
    location / {
        return 503;
    }
}
