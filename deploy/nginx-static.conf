# Picture status posts have a separate bounded upload allowance.
location = /tracker/api/social/posts {
    proxy_pass http://10.1.1.23:4173;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_cache off;
    client_max_body_size 12m;
}

# Include inside the existing lidoll.dev HTTPS server block.
# Publish ONLY the public files listed in README.md into /srv/lidoll/public/tracker/.
# Authentication and sync still require the Node service when public assets are served statically.
location ^~ /tracker/api/ {
    proxy_pass http://10.1.1.23:4173;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache off;
    client_max_body_size 256k;
}

location ^~ /tracker/auth/ {
    proxy_pass http://10.1.1.23:4173;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache off;
}

location = /tracker {
    return 308 /tracker/;
}

location = /tracker/potty_chart { return 308 "/tracker/#potty-chart"; }
location = /tracker/potty_chart/ { return 308 "/tracker/#potty-chart"; }
location = /tracker/potty_chart/index.html { return 308 "/tracker/#potty-chart"; }

location ^~ /tracker/ {
    root /srv/lidoll/public;
    index index.html;
    autoindex off;
    try_files $uri $uri/ =404;
    types {
        text/html html;
        text/css css;
        text/javascript js;
        application/manifest+json webmanifest;
        image/svg+xml svg;
        image/png png;
        image/webp webp;
        image/jpeg jpg jpeg;
        image/gif gif;
    }
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
